<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" preserveAspectRatio="none">
  <!-- Regional night-orbit chart: lng 95–130, lat 28–5 (equirectangular) -->
  <defs>
    <radialGradient id="ocean" cx="48%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#27425c"/>
      <stop offset="55%" stop-color="#162433"/>
      <stop offset="100%" stop-color="#0b1118"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d6b68"/>
      <stop offset="50%" stop-color="#3a5364"/>
      <stop offset="100%" stop-color="#2a4052"/>
    </linearGradient>
    <linearGradient id="highland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a8478"/>
      <stop offset="100%" stop-color="#3d5560"/>
    </linearGradient>
    <linearGradient id="glint" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#8eb6d9" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#8eb6d9" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8eb6d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <pattern id="speckle" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.4" fill="#cfe3f4" opacity="0.12"/>
      <circle cx="5" cy="6" r="0.35" fill="#8eb6d9" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1000" height="500" fill="url(#ocean)"/>
  <ellipse cx="420" cy="180" rx="280" ry="120" fill="url(#glint)"/>

  <!-- lat/lng grid -->
  <g stroke="rgba(142,182,217,0.1)" stroke-width="0.8" fill="none">
    <path d="M0 109h1000M0 217h1000M0 326h1000M0 435h1000"/>
    <path d="M143 0v500M286 0v500M429 0v500M571 0v500M714 0v500M857 0v500"/>
  </g>
  <g fill="rgba(142,182,217,0.28)" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="0.8">
    <text x="8" y="16">N 28°</text>
    <text x="8" y="114">N 23°</text>
    <text x="8" y="222">N 18°</text>
    <text x="8" y="331">N 13°</text>
    <text x="8" y="440">N 08°</text>
    <text x="130" y="492">E 100°</text>
    <text x="415" y="492">E 110°</text>
    <text x="700" y="492">E 120°</text>
    <text x="930" y="492">E 128°</text>
  </g>

  <g fill="url(#land)" stroke="#8eb6d9" stroke-opacity="0.28" stroke-width="1.1">
    <!-- South China / Guangxi / Guangdong -->
    <path d="M310 20c48-8 110-6 168 8 52 12 96 28 128 52 18 14 12 38-10 46-38 14-92 10-138 4-48-6-92-4-128-22-22-12-28-38-20-66 4-12 0-18 0-22z"/>
    <!-- Indochina: Myanmar / Thailand / Laos / Cambodia -->
    <path d="M72 118c28-42 72-62 118-58 38 4 62 22 78 48 12 20 8 42-6 58 22 8 42 28 48 52 6 24-8 48-28 62 8 18 6 42-8 58-16 18-42 26-68 22-18 28-8 62 18 86 8 8 4 22-10 26-28 8-62-6-78-32-18-28-22-68-12-102-8-18-22-28-22-52 0-28 8-58-8-82-10-16-8-38 0-58 8-18 22-22 38-28z"/>
    <!-- Vietnam spine -->
    <path d="M286 96c22-8 48 4 58 26 8 18 18 38 22 62 4 24 14 48 8 72-6 22-22 42-18 68 4 22-8 48-28 58-16 8-32-4-36-22-6-28 8-52 6-80-2-28-18-52-22-80-4-26 2-52 10-78 4-14 12-22 0-26z"/>
    <!-- Malay peninsula hint -->
    <path d="M98 360c18-8 32 4 36 22 4 18 8 42-2 58-8 14-24 18-34 8-12-12-14-42-8-64 4-14 4-20 8-24z"/>
    <!-- Hainan -->
    <path d="M468 148c18-6 32 4 30 18-2 12-16 22-28 20-14-2-20-14-14-26 4-8 8-10 12-12z"/>
    <!-- Taiwan -->
    <path d="M738 58c16-10 32-4 36 12 4 16-2 38-12 54-8 12-20 14-28 4-10-12-12-38-6-52 4-10 6-14 10-18z"/>
    <!-- Luzon -->
    <path d="M742 214c14-22 36-18 44 2 8 18 6 42-4 62-8 16-4 36 8 46 10 8 6 24-8 28-18 6-36-10-42-28-8-22-10-48-4-70 4-16 0-28 6-40z"/>
    <!-- Visayas / Boracay / Palawan hint -->
    <path d="M718 318c22-8 48 2 58 18 8 12 28 18 38 10 12-8 28 2 26 16-2 14-22 22-40 24-22 2-42-8-58-4-16 4-28-8-24-22 4-14 0-32 0-42z"/>
    <path d="M688 300c18-16 38-8 42 8 4 14-8 28-22 32-14 4-24-8-22-20 2-10 0-14 2-20z"/>
    <!-- Mindanao / Siargao -->
    <path d="M820 368c28-14 62-8 78 12 14 18 22 42 10 62-12 20-42 28-68 22-24-6-42-24-46-46-4-20 6-38 26-50z"/>
    <path d="M892 372c12-8 24 0 24 12 0 12-10 22-20 22-12 0-18-12-12-22 4-8 4-10 8-12z"/>
    <!-- Borneo north -->
    <path d="M620 430c48-18 110-8 148 18 22 16 18 38-8 46-42 12-102 8-148-4-28-8-32-28-18-42 8-10 16-14 26-18z"/>
  </g>

  <g fill="url(#highland)" opacity="0.55">
    <path d="M120 160c28-18 62-12 78 8 10 14 8 34-6 46-18 16-48 14-68 0-16-12-18-32-4-54z"/>
    <path d="M300 150c10-20 32-16 40 2 8 16 4 36-8 46-14 12-32 6-38-10-6-16 0-26 6-38z"/>
    <path d="M760 240c8-14 22-10 26 4 4 12-2 26-12 32-10 6-18-2-18-14 0-10 0-16 4-22z"/>
  </g>

  <rect width="1000" height="500" fill="url(#speckle)" pointer-events="none"/>

  <!-- city lights -->
  <g fill="#e8eef6">
    <circle cx="157" cy="309" r="1.6" opacity="0.7"/>
    <circle cx="310" cy="151" r="1.7" opacity="0.75"/>
    <circle cx="332" cy="373" r="1.3" opacity="0.55"/>
    <circle cx="742" cy="291" r="1.8" opacity="0.8"/>
    <circle cx="759" cy="65" r="1.5" opacity="0.7"/>
    <circle cx="522" cy="106" r="1.4" opacity="0.5"/>
    <circle cx="114" cy="200" r="1.1" opacity="0.45"/>
    <circle cx="825" cy="384" r="1.2" opacity="0.5"/>
  </g>

  <!-- coast glow -->
  <g fill="none" stroke="#8eb6d9" stroke-opacity="0.12" stroke-width="6" filter="url(#soft)">
    <path d="M286 96c22-8 48 4 58 26 8 18 18 38 22 62"/>
    <path d="M742 214c14-22 36-18 44 2 8 18 6 42-4 62"/>
    <path d="M738 58c16-10 32-4 36 12 4 16-2 38-12 54"/>
  </g>

  <rect width="1000" height="500" fill="url(#glint)" pointer-events="none"/>
</svg>
