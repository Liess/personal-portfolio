<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog CMS | Ernest John Maskariño</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231a2330'/><text x='50' y='64' text-anchor='middle' font-size='36' font-family='Inter' fill='%238eb6d9'>EJ</text></svg>" />
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      CMS.init({
        config: {
          backend: {
            name: "github",
            repo: "Liess/personal-portfolio",
            branch: "main",
            base_url: window.location.origin,
            auth_endpoint: "oauth",
          },
          site_url: window.location.origin,
          display_url: window.location.origin + "/side-quest.html#blogs",
          media_folder: "assets/blog",
          public_folder: "/assets/blog",
          publish_mode: "simple",
          collections: [
            {
              name: "blog",
              label: "Blog",
              files: [
                {
                  name: "posts",
                  label: "Posts",
                  file: "data/blog.json",
                  fields: [
                    {
                      label: "Posts",
                      name: "posts",
                      widget: "list",
                      summary: "{{fields.title}} — {{fields.status}}",
                      fields: [
                        { label: "Title", name: "title", widget: "string" },
                        { label: "Slug", name: "slug", widget: "string", hint: "URL key, e.g. consultant-workstation" },
                        { label: "Tag", name: "tag", widget: "string" },
                        {
                          label: "Status",
                          name: "status",
                          widget: "select",
                          options: ["Published", "Writing", "Queued"],
                          default: "Writing",
                        },
                        { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false },
                        { label: "Excerpt", name: "excerpt", widget: "text" },
                        { label: "Body", name: "body", widget: "markdown" },
                      ],
                    },
                  ],
                },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
