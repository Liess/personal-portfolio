<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blog | Ernest John Maskariño</title>
    <meta name="description" content="A longer note from the side quest." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231a2330'/><text x='50' y='64' text-anchor='middle' font-size='36' font-family='Inter' fill='%238eb6d9'>EJ</text></svg>" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <header class="site-header" id="header">
      <div class="header-inner">
        <a href="index.html" class="brand"><span>EJ</span><small>/ Maskariño</small></a>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
          <span></span><span></span><span></span>
        </button>
        <nav id="site-nav">
          <a href="index.html#about" class="nav-flip"><span>ABOUT</span><span>ABOUT</span></a>
          <a href="index.html#career" class="nav-flip"><span>CAREER</span><span>CAREER</span></a>
          <a href="index.html#work" class="nav-flip"><span>WORK</span><span>WORK</span></a>
          <a href="side-quest.html" class="nav-flip" aria-current="page"><span>SIDE QUEST</span><span>SIDE QUEST</span></a>
          <a href="investment.html" class="nav-flip"><span>INVESTMENT PORTFOLIO</span><span>INVESTMENT PORTFOLIO</span></a>
          <a href="index.html#contact" class="nav-flip"><span>CONTACT</span><span>CONTACT</span></a>
        </nav>
      </div>
    </header>

    <main class="quest blog-page">
      <section class="quest-hero">
        <div class="wide">
          <p class="eyebrow" id="blog-tag">Blog</p>
          <h1 class="display" id="blog-title">Loading</h1>
          <p class="lead quest-lead" id="blog-excerpt"></p>
          <p class="blog-place" id="blog-place" hidden></p>
          <div class="quest-jump">
            <a href="side-quest.html#blogs">← Blogs</a>
          </div>
        </div>
      </section>
      <section class="blog-main">
        <div class="blog-article">
          <figure class="blog-cover-frame" id="blog-cover-frame" hidden>
            <img id="blog-cover" class="blog-cover" alt="" />
          </figure>
          <div class="blog-gallery-wrap" id="blog-gallery-wrap" hidden>
            <div class="blog-gallery-viewport">
              <div class="blog-gallery-track" id="blog-gallery"></div>
            </div>
            <div class="blog-gallery-bar" id="blog-gallery-bar" hidden>
              <span class="blog-gallery-num" id="blog-gallery-num"></span>
              <div class="work-nav">
                <button type="button" id="blog-gallery-prev" aria-label="Previous photos">←</button>
                <button type="button" id="blog-gallery-next" aria-label="Next photos">→</button>
              </div>
            </div>
          </div>
          <article class="blog-body" id="blog-body"></article>
        </div>
      </section>
    </main>

    <div class="lightbox is-photo" id="blog-lightbox" hidden>
      <button type="button" class="lightbox-close" id="blog-lightbox-close" aria-label="Close">✕</button>
      <button type="button" class="lightbox-nav prev" id="blog-lightbox-prev" aria-label="Previous">←</button>
      <figure>
        <img id="blog-lightbox-img" alt="" />
      </figure>
      <button type="button" class="lightbox-nav next" id="blog-lightbox-next" aria-label="Next">→</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/marked.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/blog.js?v=focus"></script>
  </body>
</html>
